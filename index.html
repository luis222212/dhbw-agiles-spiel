<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatchMind – Finde deinen Weg</title>
    <meta name="description"
        content="MatchMind – Ein interaktives Lernspiel über das Duale Studium an der DHBW. Finde die passenden Paare und teste dein Wissen!" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>

    <!-- ===========================
       START SCREEN
       =========================== -->
    <div id="start-screen" class="glass">
        <div class="logo">Match<span>Mind</span></div>
        <p class="tagline">Finde deinen Weg</p>

        <div class="form-group">
            <label for="difficulty">Schwierigkeit</label>
            <select id="difficulty">
                <option value="easy">Leicht – 12 Paare (Grün)</option>
                <option value="medium" selected>Mittel – 23 Paare (Grün + Gelb)</option>
                <option value="hard">Schwer – 32 Paare (Alle + Quiz)</option>
            </select>
        </div>

        <button id="btn-start" class="btn-primary">
            🚀 Spiel starten
        </button>
    </div>

    <!-- ===========================
       GAME SCREEN
       =========================== -->
    <div id="game-screen">
        <div class="hud glass">
            <div class="hud-item">
                <span class="hud-icon">⏱️</span>
                <div>
                    <div class="hud-label">Zeit</div>
                    <div class="hud-value" id="timer">60</div>
                </div>
            </div>
            <div class="hud-item">
                <span class="hud-icon">⭐</span>
                <div>
                    <div class="hud-label">Score</div>
                    <div class="hud-value" id="score">0</div>
                </div>
            </div>
            <div class="hud-item">
                <span class="hud-icon">🃏</span>
                <div>
                    <div class="hud-label">Paare</div>
                    <div class="hud-value" id="pairs-left">0</div>
                </div>
            </div>
        </div>

        <div id="legend" class="legend"></div>
        <div id="board"></div>
    </div>

    <!-- ===========================
       END SCREEN
       =========================== -->
    <div id="end-screen" class="glass">
        <div class="trophy">🏆</div>
        <h2 id="end-title">Geschafft!</h2>
        <p class="result-text" id="end-message">Du hast alle Paare gefunden.</p>
        <div class="stat-row">
            <div class="stat">
                <div class="stat-val" id="final-score">0</div>
                <div class="stat-label">Punkte</div>
            </div>
            <div class="stat">
                <div class="stat-val" id="final-time">0s</div>
                <div class="stat-label">Restzeit</div>
            </div>
        </div>
        <button id="btn-restart" class="btn-primary">🔄 Nochmal spielen</button>
    </div>

    <!-- ===========================
       SCRIPTS (data first, then game logic)
       =========================== -->
    <script src="js/data.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
